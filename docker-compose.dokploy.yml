services:
  app:
    image: ghcr.io/annaskhadafi/one-chitra:latest
    pull_policy: always
    container_name: one-chitra-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      UPLOAD_DIR: /app/uploads
      UPLOAD_DRIVER: ${UPLOAD_DRIVER:-s3}
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-${S3_ENDPOINT}}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-${S3_BUCKET}}
      OBJECT_STORAGE_PREFIX: ${OBJECT_STORAGE_PREFIX:-${S3_PREFIX:-upload}}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-${S3_REGION:-us-east-1}}
      OBJECT_STORAGE_FORCE_PATH_STYLE: ${OBJECT_STORAGE_FORCE_PATH_STYLE:-${S3_FORCE_PATH_STYLE:-true}}
      OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID:-${S3_ACCESS_KEY_ID:-${AWS_ACCESS_KEY_ID}}}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:-${S3_SECRET_ACCESS_KEY:-${AWS_SECRET_ACCESS_KEY}}}
      S3_ENDPOINT: ${S3_ENDPOINT:-${OBJECT_STORAGE_ENDPOINT}}
      S3_BUCKET: ${S3_BUCKET:-${OBJECT_STORAGE_BUCKET}}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-${OBJECT_STORAGE_ACCESS_KEY_ID:-${AWS_ACCESS_KEY_ID}}}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-${OBJECT_STORAGE_SECRET_ACCESS_KEY:-${AWS_SECRET_ACCESS_KEY}}}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://one.chitraparatama.com}
      NEXT_PUBLIC_BETTER_AUTH_URL: ${NEXT_PUBLIC_BETTER_AUTH_URL:-https://one.chitraparatama.com}
      DATABASE_URL: ${DATABASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_OCR_ENDPOINT: ${MISTRAL_OCR_ENDPOINT:-https://api.mistral.ai/v1/ocr}
      MISTRAL_MAP_MODEL: ${MISTRAL_MAP_MODEL:-mistral-small-latest}
      CRON_SECRET: ${CRON_SECRET:-}
      WA_GATEWAY_URL: ${WA_GATEWAY_URL:-http://one-chitra-wa-gateway:3001}
      WA_GATEWAY_SECRET: ${WA_GATEWAY_SECRET:-och-wa-secret-token}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://9router.chitraparatama.com/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-cx/gpt-5.6-luna}
    volumes:
      - /mnt/data/one-chitra/uploads:/app/uploads
    networks:
      - one-chitra-net

  wa-gateway:
    image: ghcr.io/annaskhadafi/one-chitra-wa-gateway:latest
    pull_policy: always
    container_name: one-chitra-wa-gateway
    restart: unless-stopped
    ports:
      - "${WA_GATEWAY_PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      WA_GATEWAY_PORT: 3001
      WA_AUTH_DIR: /app/baileys_auth
      WA_WEBHOOK_URL: http://one-chitra-app:3000/api/whatsapp/webhook
      WA_GATEWAY_SECRET: ${WA_GATEWAY_SECRET:-och-wa-secret-token}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://one.chitraparatama.com}
    volumes:
      - /mnt/data/one-chitra/baileys_auth:/app/baileys_auth
    networks:
      - one-chitra-net

networks:
  one-chitra-net:
    driver: bridge
