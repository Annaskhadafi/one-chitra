services:
  app:
    image: ghcr.io/annaskhadafi/one-chitra:latest
    pull_policy: always
    container_name: one-chitra-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      UPLOAD_DIR: /app/uploads
      UPLOAD_DRIVER: ${UPLOAD_DRIVER:-s3}
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-${S3_ENDPOINT:-https://is3.cloudhost.id}}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-${S3_BUCKET:-onechitra}}
      OBJECT_STORAGE_PREFIX: ${OBJECT_STORAGE_PREFIX:-${S3_PREFIX:-upload}}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-${S3_REGION:-us-east-1}}
      OBJECT_STORAGE_FORCE_PATH_STYLE: ${OBJECT_STORAGE_FORCE_PATH_STYLE:-${S3_FORCE_PATH_STYLE:-true}}
      OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID:-${S3_ACCESS_KEY_ID:-${AWS_ACCESS_KEY_ID:-I2BBBINVCAQXY7G6M5OD}}}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:-${S3_SECRET_ACCESS_KEY:-${AWS_SECRET_ACCESS_KEY:-c4YupRIPTlaetB3XIwIXOO8EBcZWZfTrEqghDN1A}}}
      S3_ENDPOINT: ${S3_ENDPOINT:-${OBJECT_STORAGE_ENDPOINT:-https://is3.cloudhost.id}}
      S3_BUCKET: ${S3_BUCKET:-${OBJECT_STORAGE_BUCKET:-onechitra}}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-${OBJECT_STORAGE_ACCESS_KEY_ID:-${AWS_ACCESS_KEY_ID:-I2BBBINVCAQXY7G6M5OD}}}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-${OBJECT_STORAGE_SECRET_ACCESS_KEY:-${AWS_SECRET_ACCESS_KEY:-c4YupRIPTlaetB3XIwIXOO8EBcZWZfTrEqghDN1A}}}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://one.chitraparatama.com}
      NEXT_PUBLIC_BETTER_AUTH_URL: ${NEXT_PUBLIC_BETTER_AUTH_URL:-https://one.chitraparatama.com}
      DATABASE_URL: ${DATABASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_OCR_ENDPOINT: ${MISTRAL_OCR_ENDPOINT:-https://api.mistral.ai/v1/ocr}
      MISTRAL_MAP_MODEL: ${MISTRAL_MAP_MODEL:-mistral-small-latest}
      CRON_SECRET: ${CRON_SECRET:-}
    volumes:
      - /mnt/data/one-chitra/uploads:/app/uploads
    networks:
      - one-chitra-net

networks:
  one-chitra-net:
    driver: bridge
