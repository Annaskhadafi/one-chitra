# Nixpacks Configuration for Dokploy Deployment
# https://nixpacks.com/docs/configuration/file

[phases.setup]
nixPkgs = ["nodejs_20", "npm-9_x", "bash"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = [
  "npm run db:push",
  "npm run build",
  # Copy static files to standalone directory (using sh-compatible syntax)
  "cp -r .next/static .next/standalone/.next/static || true",
  "cp -r public .next/standalone/public || true"
]

[start]
cmd = "node .next/standalone/server.js"

[variables]
NODE_ENV = "production"
HOSTNAME = "0.0.0.0"
PORT = "3000"
