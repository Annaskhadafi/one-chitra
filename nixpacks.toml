# Nixpacks Configuration for Dokploy Deployment
# https://nixpacks.com/docs/configuration/file

[phases.setup]
nixPkgs = ["nodejs_22", "npm-9_x", "bash"]
# Menambahkan library sistem agar dikelola Nixpacks (lebih stabil)
aptPkgs = [
  "libnss3", "libatk1.0-0", "libatk-bridge2.0-0", "libcups2", 
  "libgbm1", "libasound2", "libpangocairo-1.0-0", "libxss1", 
  "libgtk-3-0", "libxshmfence1", "libglu1", "chromium-browser"
]

[phases.install]
cmds = ["npm ci"]
# Aktifkan cache untuk npm
cache = ["/root/.npm"]

[phases.build]
cmds = [
  "npm run build",
  "mkdir -p .next/standalone/.next/static && cp -r .next/static/. .next/standalone/.next/static/",
  "mkdir -p .next/standalone/public && cp -r public/. .next/standalone/public/"
]
# Aktifkan cache untuk build Next.js (CRITICAL untuk kecepatan)
cache = ["node_modules/.cache", ".next/cache"]

[start]
# mkdir ensures /app/uploads exists at startup (volume mount may not create the dir)
cmd = "mkdir -p /app/uploads && npm run db:push && node .next/standalone/server.js"

[variables]
NODE_ENV = "production"
HOSTNAME = "0.0.0.0"
PORT = "3000"
NODE_VERSION = "22"
# Volume mount path for uploaded files — mount Dokploy volume at /app/uploads
UPLOAD_DIR = "/app/uploads"
